org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# The Steam Frame is arm64 only. Never build a second ABI: the native side is large and
# a 32-bit slice would only inflate the APK and the build time.
re3.abi=arm64-v8a
